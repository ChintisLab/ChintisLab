name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ChintisLab
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-2026.svg?palette=github-dark&year=2026
            dist/snake-2025.svg?palette=github-dark&year=2025
            dist/snake-2024.svg?palette=github-dark&year=2024
            dist/snake-2023.svg?palette=github-dark&year=2023

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
