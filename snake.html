<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rachana's Contribution Snake</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    /* HEADER */
    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #7c3aed, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .header p {
      color: #7d8590;
      font-size: 0.85rem;
    }

    /* YEAR SELECTOR */
    .year-selector {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 8px 16px;
    }

    .year-label {
      color: #7d8590;
      font-size: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .year-buttons {
      display: flex;
      gap: 8px;
    }

    .year-btn {
      background: transparent;
      border: 1px solid #30363d;
      color: #7d8590;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .year-btn:hover {
      border-color: #a78bfa;
      color: #a78bfa;
      background: rgba(167, 139, 250, 0.08);
    }

    .year-btn.active {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      border-color: #a78bfa;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(124, 58, 237, 0.4);
    }

    /* SNAKE DISPLAY */
    .snake-card {
      width: 100%;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    .snake-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(124,58,237,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .year-badge {
      font-size: 1.1rem;
      font-weight: 700;
      color: #a78bfa;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .year-badge::before,
    .year-badge::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #30363d);
      width: 80px;
    }

    .year-badge::after {
      background: linear-gradient(90deg, #30363d, transparent);
    }

    .snake-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      min-height: 130px;
      align-items: center;
      position: relative;
    }

    .snake-wrapper img {
      width: 100%;
      max-width: 820px;
      border-radius: 8px;
      transition: opacity 0.3s ease;
    }

    .snake-wrapper img.loading {
      opacity: 0.3;
    }

    .loading-text {
      position: absolute;
      color: #7d8590;
      font-size: 0.8rem;
      display: none;
    }

    /* STATS ROW */
    .stats-row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat-chip {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.78rem;
      color: #7d8590;
    }

    .stat-chip span {
      color: #a78bfa;
      font-weight: 700;
    }

    /* BACK LINK */
    .back-link {
      color: #7d8590;
      text-decoration: none;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .back-link:hover { color: #a78bfa; }

    /* PULSE ANIMATION ON SNAKE */
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 12px rgba(124,58,237,0.2); }
      50%       { box-shadow: 0 0 28px rgba(124,58,237,0.5); }
    }

    .snake-card { animation: glow-pulse 4s ease-in-out infinite; }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .header h1 { font-size: 1.4rem; }
      .year-btn { padding: 5px 10px; font-size: 0.8rem; }
      .snake-card { padding: 20px 12px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <h1>🐍 Contribution Snake</h1>
      <p>Rachana Anugandula &nbsp;·&nbsp; @ChintisLab</p>
    </div>

    <!-- YEAR SELECTOR -->
    <div class="year-selector">
      <span class="year-label">Year</span>
      <div class="year-buttons">
        <button class="year-btn active" onclick="setYear('all')">All Time</button>
        <button class="year-btn" onclick="setYear('2025')">2025</button>
        <button class="year-btn" onclick="setYear('2024')">2024</button>
        <button class="year-btn" onclick="setYear('2023')">2023</button>
      </div>
    </div>

    <!-- SNAKE CARD -->
    <div class="snake-card">
      <div class="year-badge" id="year-badge">✦ &nbsp; ALL TIME &nbsp; ✦</div>
      <div class="snake-wrapper">
        <img id="snake-img"
             src="https://raw.githubusercontent.com/ChintisLab/ChintisLab/output/snake-dark.svg"
             alt="Contribution Snake"/>
        <span class="loading-text" id="loading-text">Loading snake...</span>
      </div>
      <div class="stats-row">
        <div class="stat-chip">🟢 Green = contributions</div>
        <div class="stat-chip">🟣 Purple dots = the snake</div>
        <div class="stat-chip">Updates <span>daily</span> at midnight</div>
      </div>
    </div>

    <!-- BACK LINK -->
    <a class="back-link" href="https://github.com/ChintisLab">
      ← Back to GitHub Profile
    </a>

  </div>

  <script>
    const SNAKES = {
      all:  'https://raw.githubusercontent.com/ChintisLab/ChintisLab/output/snake-dark.svg',
      2025: 'https://raw.githubusercontent.com/ChintisLab/ChintisLab/output/snake-2025.svg',
      2024: 'https://raw.githubusercontent.com/ChintisLab/ChintisLab/output/snake-2024.svg',
      2023: 'https://raw.githubusercontent.com/ChintisLab/ChintisLab/output/snake-2023.svg',
    };

    const LABELS = {
      all:  '✦ &nbsp; ALL TIME &nbsp; ✦',
      2025: '✦ &nbsp; 2025 &nbsp; ✦',
      2024: '✦ &nbsp; 2024 &nbsp; ✦',
      2023: '✦ &nbsp; 2023 &nbsp; ✦',
    };

    function setYear(year) {
      // Update buttons
      document.querySelectorAll('.year-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // Update badge
      document.getElementById('year-badge').innerHTML = LABELS[year];

      // Swap image with fade
      const img = document.getElementById('snake-img');
      img.classList.add('loading');
      const newImg = new Image();
      newImg.onload = () => {
        img.src = SNAKES[year];
        img.classList.remove('loading');
      };
      newImg.onerror = () => {
        img.src = SNAKES[year];
        img.classList.remove('loading');
      };
      newImg.src = SNAKES[year] + '?t=' + Date.now();
    }
  </script>
</body>
</html>
